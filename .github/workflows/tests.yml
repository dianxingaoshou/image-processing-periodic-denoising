name: Unit tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests without downloaded datasets
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Run analytical and numerical unit tests
        run: python -m pytest -q
      - name: Verify frozen study source and numerical records
        run: python experiments/run.py check
